version: "2"
sql:
  - engine: "postgresql"
    queries: "database/queries.sql"
    schema: "database/migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          # UUID not nullable
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          # UUID nullable
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

          # Date not nullable
          - db_type: "date"
            go_type: "time.Time"

          # Date nullable
          - db_type: "date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true

          # timestamptz
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"

          # int
          - db_type: "integer"
            go_type: "int"

          # double
          - db_type: "double precision"
            go_type: "float64"
