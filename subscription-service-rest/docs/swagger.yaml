basePath: /api/v1
consumes:
- application/json
definitions:
  handler.CreateSubscriptionParams:
    properties:
      end_date:
        type: string
      price:
        type: integer
      service_name:
        type: string
      start_date:
        type: string
      user_id:
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handler.SubscriptionResponse:
    properties:
      created_at:
        type: string
      end_date:
        type: string
      id:
        type: integer
      price:
        type: integer
      service_name:
        type: string
      start_date:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  handler.TotalSubscriptionsResponse:
    properties:
      total_price:
        type: integer
    type: object
  handler.UpdateSubscriptionParams:
    properties:
      end_date:
        type: string
      price:
        type: integer
      service_name:
        type: string
      start_date:
        type: string
      user_id:
        type: string
    type: object
host: localhost:8090
info:
  contact: {}
  description: REST API for managing user subscriptions
  title: Subscription Service API
  version: "1.0"
paths:
  /subscriptions:
    get:
      consumes:
      - application/json
      description: List subscriptions.
      parameters:
      - description: Limit the number of subscriptions returned
        in: query
        name: limit
        type: integer
      - description: Offset the subscriptions returned
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of subscriptions
          schema:
            items:
              $ref: '#/definitions/handler.SubscriptionResponse'
            type: array
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List subscriptions
      tags:
      - subscriptions
    post:
      consumes:
      - application/json
      description: Create a new subscription.
      parameters:
      - description: Subscription to create
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/handler.CreateSubscriptionParams'
      produces:
      - application/json
      responses:
        "200":
          description: Created subscription
          schema:
            $ref: '#/definitions/handler.SubscriptionResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Create a new subscription
      tags:
      - subscriptions
  /subscriptions/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a subscription by its ID.
      parameters:
      - description: Subscription ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Subscription deleted
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Subscription not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Delete a subscription by ID
      tags:
      - subscriptions
    get:
      consumes:
      - application/json
      description: Get a subscription by its ID.
      parameters:
      - description: Subscription ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Subscription
          schema:
            $ref: '#/definitions/handler.SubscriptionResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Subscription not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get a subscription by ID
      tags:
      - subscriptions
    put:
      consumes:
      - application/json
      description: Update a subscription by its ID.
      parameters:
      - description: Subscription ID
        in: path
        name: id
        required: true
        type: integer
      - description: Subscription to update
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateSubscriptionParams'
      produces:
      - application/json
      responses:
        "200":
          description: Updated subscription
          schema:
            $ref: '#/definitions/handler.SubscriptionResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Subscription not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Update a subscription by ID
      tags:
      - subscriptions
  /subscriptions/total:
    get:
      consumes:
      - application/json
      description: Get total price of subscriptions within a specified period.
      parameters:
      - description: 'Start date of the period (format: 01-2006)'
        in: query
        name: start_date
        required: true
        type: string
      - description: 'End date of the period (format: 01-2006)'
        in: query
        name: end_date
        required: true
        type: string
      - description: User ID
        in: query
        name: user_id
        required: true
        type: string
      - description: Service name
        in: query
        name: service_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Total price of subscriptions
          schema:
            $ref: '#/definitions/handler.TotalSubscriptionsResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get total price of subscriptions
      tags:
      - subscriptions
produces:
- application/json
schemes:
- http
swagger: "2.0"
